name: RH Desk quality checks
on:
  push:
    branches: ["main", "feat/**", "edition/**"]
  pull_request:
    branches: ["main"]
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: people-desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: people-desk/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  local-edition:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: people-desk
    env:
      NEXT_PUBLIC_RH_DESK_REMOTE: "1"
      NEXT_PUBLIC_RH_DESK_STORAGE: "local-server"
      RH_DESK_BACKEND: local
      RH_DESK_PUBLIC_ORIGIN: "http://127.0.0.1:3001"
      RH_LOCAL_ADMIN_EMAIL: "admin@example.test"
      RH_LOCAL_SESSION_SECRET: "ci-local-test-secret-not-used-outside-ci-01234567890123456789"
      RH_LOCAL_TEST_PASSWORD: "CiOnly-DoNotUseInProduction-2026!"
      RH_LOCAL_DATA_DIR: "/tmp/rh-desk-local-data"
      RH_LOCAL_COOKIE_SECURE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: people-desk/package-lock.json
      - run: npm ci
      - name: Create a throwaway scrypt hash for this CI job
        run: |
          node -e 'const c=require("node:crypto");const salt=c.randomBytes(16);const hash=c.scryptSync(process.env.RH_LOCAL_TEST_PASSWORD,salt,64);require("node:fs").appendFileSync(process.env.GITHUB_ENV,"RH_LOCAL_ADMIN_PASSWORD_HASH=scrypt:"+salt.toString("hex")+":"+hash.toString("hex")+"\n")'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.local.config.ts
      - name: Build local Docker image
        working-directory: .
        run: docker build -f selfhost/Dockerfile -t rhdesk-local-ci .
      - name: Boot local Docker image with a persistent data volume
        working-directory: .
        run: |
          docker volume create rhdesk-smoke-volume
          docker run -d --name rhdesk-smoke -p 127.0.0.1:3100:3000 \
            --env RH_DESK_BACKEND=local \
            --env NEXT_PUBLIC_RH_DESK_REMOTE=1 \
            --env NEXT_PUBLIC_RH_DESK_STORAGE=local-server \
            --env RH_LOCAL_DATA_DIR=/data \
            --env RH_LOCAL_COOKIE_SECURE=0 \
            --env RH_DESK_PUBLIC_ORIGIN=http://127.0.0.1:3100 \
            --env RH_LOCAL_ADMIN_EMAIL="$RH_LOCAL_ADMIN_EMAIL" \
            --env RH_LOCAL_ADMIN_PASSWORD_HASH="$RH_LOCAL_ADMIN_PASSWORD_HASH" \
            --env RH_LOCAL_SESSION_SECRET="$RH_LOCAL_SESSION_SECRET" \
            -v rhdesk-smoke-volume:/data rhdesk-local-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/health > /tmp/rhdesk-ci-health.json; then
              cat /tmp/rhdesk-ci-health.json
              curl --fail --silent --show-error --cookie-jar /tmp/rhdesk-ci-cookies.txt \
                -H "Origin: http://127.0.0.1:3100" \
                -H "Content-Type: application/json" \
                --data "{\"email\":\"$RH_LOCAL_ADMIN_EMAIL\",\"password\":\"$RH_LOCAL_TEST_PASSWORD\"}" \
                http://127.0.0.1:3100/api/auth/login | grep -q '"ok":true'
              curl --fail --silent --show-error --cookie /tmp/rhdesk-ci-cookies.txt \
                http://127.0.0.1:3100/api/workspace | grep -q '"revision":0'
              exit 0
            fi
            sleep 2
          done
          docker logs rhdesk-smoke
          exit 1
      - name: Clean temporary Docker data
        if: always()
        working-directory: .
        run: |
          docker rm -f rhdesk-smoke || true
          docker volume rm rhdesk-smoke-volume || true
